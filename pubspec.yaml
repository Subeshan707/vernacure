name: vernacure
description: "Vernacure - Multilingual AI & Blockchain InsurTech Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^14.0.0
  
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  
  # Blockchain - Web3
  web3dart: ^2.7.3
  http: ^1.2.0
  
  # Voice & Audio
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  # Assets - using Google Fonts from CDN
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
